[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-fan-pulse"
version = "0.1.0"
description = "Lines up Reddit game-thread sentiment with MLB play-by-play and win probability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "duckdb>=1.0",
    "pandas>=2.1",
    "pyarrow>=15",
    "plotly>=5.20",
    "rapidfuzz>=3.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy (pulls in torch). Only needed from Phase 4 onwards.
nlp = [
    "transformers>=4.40",
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mlb-fan-pulse = "mlb_fan_pulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
